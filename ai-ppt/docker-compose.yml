services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/aippt?sslmode=disable"
      DIRECT_URL: "postgresql://postgres:postgres@postgres:5432/aippt?sslmode=disable"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
      REDIS_URL: "redis://redis:6379"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-http://localhost:3000}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_CALLBACK_URL: "${GOOGLE_CALLBACK_URL:-http://localhost:3000/api/auth/callback/google}"
      AI_PROVIDER: "${AI_PROVIDER:-gemini}"
      TEXT_PROVIDER: "${TEXT_PROVIDER:-gemini}"
      OUTLINE_PROVIDER: "${OUTLINE_PROVIDER:-gemini}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.5-pro}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_OUTLINE_MODEL: "${OPENAI_OUTLINE_MODEL:-gpt-4.1-mini}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "db:push", "--", "--accept-data-loss"]
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/aippt?sslmode=disable"
      DIRECT_URL: "postgresql://postgres:postgres@postgres:5432/aippt?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/aippt?sslmode=disable"
      DIRECT_URL: "postgresql://postgres:postgres@postgres:5432/aippt?sslmode=disable"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
      REDIS_URL: "redis://redis:6379"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.5-pro}"
      IMAGEN_MODEL: "${IMAGEN_MODEL:-imagen-4.0-generate-001}"
      AI_PROVIDER: "${AI_PROVIDER:-gemini}"
      TEXT_PROVIDER: "${TEXT_PROVIDER:-gemini}"
      IMAGE_PROVIDER: "${IMAGE_PROVIDER:-imagen}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_OUTLINE_MODEL: "${OPENAI_OUTLINE_MODEL:-gpt-4.1-mini}"
      OPENAI_SLIDE_MODEL: "${OPENAI_SLIDE_MODEL:-gpt-4.1-mini}"
      OPENAI_IMAGE_MODEL: "${OPENAI_IMAGE_MODEL:-gpt-image-1}"
      OPENAI_IMAGE_QUALITY: "${OPENAI_IMAGE_QUALITY:-low}"
      OPENAI_IMAGE_SIZE: "${OPENAI_IMAGE_SIZE:-1536x1024}"
      IMAGEKIT_PUBLIC_KEY: "${IMAGEKIT_PUBLIC_KEY:-}"
      IMAGEKIT_PRIVATE_KEY: "${IMAGEKIT_PRIVATE_KEY:-}"
      IMAGEKIT_URL_ENDPOINT: "${IMAGEKIT_URL_ENDPOINT:-}"
      WORKER_CLASSES: "${WORKER_CLASSES:-outline,content,image,upload,finalize}"
      
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    deploy:
      replicas: 2

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aippt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aippt"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    restart: unless-stopped

volumes:
  pg_data:
