global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Application metrics (queue depth, generation jobs, latency). The /api/metrics
  # endpoint fails closed in production, so Prometheus authenticates with the
  # METRICS_TOKEN written to /etc/prometheus/metrics_token (see docs/DEPLOY.md).
  # DNS service discovery scrapes every `web` replica.
  - job_name: app
    metrics_path: /api/metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    dns_sd_configs:
      - names: ["web"]
        type: A
        port: 3000
