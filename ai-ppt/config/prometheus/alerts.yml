groups:
  - name: ai-ppt-core
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} target is down"
          description: "{{ $labels.instance }} has been unreachable for 3m."

      - alert: HighDiskUsage
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk usage above 85%"
          description: "Root filesystem on {{ $labels.instance }} is {{ $value | humanizePercentage }} full."

      - alert: HighMemoryUsage
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memory usage above 90%"

      - alert: PostgresConnectionsHigh
        expr: pg_stat_activity_count > 130
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Postgres connections approaching max_connections (150)"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory above 90% of maxmemory"

  - name: ai-ppt-app
    rules:
      - alert: GenerationQueueBacklog
        expr: queue_depth_messages > 200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Generation queue backlog: {{ $labels.queue }}"
          description: "{{ $value }} messages waiting on {{ $labels.queue }} for 10m — workers may be saturated or a provider is degraded."

      - alert: DeadLetterJobs
        expr: increase(generation_jobs_total{status="DEAD_LETTER"}[15m]) > 5
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Generation jobs are dead-lettering"
          description: "More than 5 jobs dead-lettered in 15m — check provider health / budget caps."
